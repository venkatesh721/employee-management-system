name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: globalco_ci
          POSTGRES_PASSWORD: globalco_ci_password
          POSTGRES_DB: globalco_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globalco_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint backend
        run: ruff check app tests seed_data.py
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://globalco_ci:globalco_ci_password@localhost:5432/globalco_ci
        run: alembic upgrade head
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test
      - name: Build frontend
        run: npm run build
